---
on:
  workflow_call:
    inputs:
      ref_name:
        description: "The branch reference used to create a tag against"
        required: false
        type: string
        default: "main"
      GhAppId:
        description: "The id of the GitHub App"
        required: false
        type: string
    secrets:
      GitHubToken:
        description: "The GitHub token for the GitHub Actions workflow"
        required: false
      GhAppPrivateKey:
        description: "The private key for the GitHub App"
        required: false

jobs:
  tag:
    name: Tag Collection
    runs-on: build-general-linux
    permissions:
      contents: write
    steps:
      - name: Generate gh app token
        if: ${{ inputs.GhAppId }}
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ inputs.GhAppId }}
          private-key: ${{ secrets.GhAppPrivateKey }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_name }}
          token: ${{ steps.app-token.outputs.token || secrets.GitHubToken }}
          fetch-depth: 0

      - name: Bump Semver
        uses: ./.github/workflow-templates/bump_semver.yml

      - name: Update galaxy.yml with new version
        run: |-
          if ! [ -f galaxy.yml ]; then
            echo "galaxy.yml does not exist."
            exit 1
          fi

          # Trim dry_run long tag to short tag
          SEMVER=$(echo $SEMVER | cut -d '-' -f 1)
          echo "SEMVER=$SEMVER" >> $GITHUB_ENV
          echo "Updating galaxy.yml with version $SEMVER"

          if ! grep -q "version: $SEMVER" galaxy.yml; then
            sed -i "s/version: .*/version: $SEMVER/" galaxy.yml

            echo "Configuring git"
          git config user.name "${{ steps.app-token.outputs.app-slug && 'ansible-cicd-tsp[bot]' || 'svc_github' }}"
          git config user.email "${{ steps.app-token.outputs.app-slug && 'ansible-cicd-tsp[bot]@users.noreply.github.com' || 'svc_github@example.com' }}"

            git commit -am "Bump galaxy version to $SEMVER"
          else
            echo "galaxy.yml already has version $SEMVER"
          fi
        shell: bash
        working-directory: "${{ github.workspace }}"

      - name: Tag repo
        run: |-
          echo "Pulling latest changes"
          git pull origin ${{ inputs.ref_name }}
          echo "Tagging branch with version "$SEMVER" and "latest""
          git tag $SEMVER
          git tag --force latest
          git push --tags origin ${{ inputs.ref_name }} --force
        shell: bash
        working-directory: "${{ github.workspace }}"

      - name: Output Summary
        run: |-
          cp galaxy.yml galaxy.md
          sed -i '1i ```GalaxyCollection' galaxy.md
          sed -i '$a ```'  galaxy.md
          sed -i '1i - Has documentation link' galaxy.md
          sed -i '1i - Has repository link' galaxy.md
          sed -i '1i - The license has been set' galaxy.md
          sed -i '1i - There is a description' galaxy.md
          sed -i '1i - The collection has an author' galaxy.md
          sed -i '1i - There is a README file' galaxy.md
          sed -i '1i - The collection has a namespace' galaxy.md
          sed -i '1i Ensure the following have been checked before approval:' galaxy.md
          sed -i '1i ### Galaxy Collection Checks' galaxy.md
          cat galaxy.md >> $GITHUB_STEP_SUMMARY
          rm galaxy.md
        shell: bash
        working-directory: "${{ github.workspace }}"