---
name: Bump SemVer Template
on:
  workflow_call:
    secrets:
      GitHubAppPrivateKey:
        description: "The private key for the GitHub App"
        required: true
    inputs:
      GitHubAppId:
        description: "The id of the GitHub App"
        required: true
        type: string
      NextTag:
        description: "The next tag to use"
        required: true
        type: string
jobs:
  bump_semver:
    name: Bump SemVer
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@main
        id: gh_token
        with:
          private-key: ${{ secrets.GitHubAppPrivateKey }}
          client-id: ${{ inputs.GitHubAppId }}
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          token: ${{ steps.gh_token.outputs.token }}
          fetch-depth: 0
      - name: Tag And Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ inputs.NextTag }} -m "Version ${{ inputs.NextTag }}"
          git push --tags
      - name: Bump Version in Galaxy Metadata
        env:
          # Commit on the branch that triggered this run (not hardcoded main).
          # pull_request events use the base branch; workflow_dispatch uses the selected ref.
          BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ ! -f galaxy.yml ]; then
            echo "galaxy.yml does not exist."
            exit 1
          fi

          # Trim dry-run / pre-release suffix (e.g. 1.2.3-dryrun -> 1.2.3)
          SEMVER=$(echo "${{ inputs.NextTag }}" | cut -d '-' -f 1)
          SEMVER="${SEMVER#v}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace the version: line by rewriting the file (more reliable than in-place sed).
          set_galaxy_version() {
            local semver="$1"
            local file="galaxy.yml"
            local tmp
            tmp="$(mktemp)"

            if ! awk -v ver="$semver" '
              BEGIN { updated = 0 }
              /^[[:space:]]*version[[:space:]]*:/ {
                print "version: " ver
                updated = 1
                next
              }
              { print }
              END { exit updated ? 0 : 1 }
            ' "$file" > "$tmp"; then
              rm -f "$tmp"
              echo "No version: line found in ${file}" >&2
              return 1
            fi

            mv "$tmp" "$file"
          }

          # Remote main can move while this job runs (other merges/workflows).
          # Refresh, apply the bump on the latest tip, then rebase/retry on push races.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            current="$(awk -F': *' '/^[[:space:]]*version[[:space:]]*:/ { gsub(/["'\'' ]/, "", $2); print $2; exit }' galaxy.yml)"
            if [ "$current" = "$SEMVER" ]; then
              echo "galaxy.yml already has version $SEMVER"
              exit 0
            fi

            echo "Updating galaxy.yml with version $SEMVER (attempt ${attempt}; was ${current:-unknown})"
            set_galaxy_version "$SEMVER"

            current="$(awk -F': *' '/^[[:space:]]*version[[:space:]]*:/ { gsub(/["'\'' ]/, "", $2); print $2; exit }' galaxy.yml)"
            if [ "$current" != "$SEMVER" ]; then
              echo "Failed to update version in galaxy.yml (found: ${current:-none})"
              exit 1
            fi

            git add galaxy.yml
            git commit -m "Bump galaxy version to $SEMVER"

            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi

            echo "Push rejected; retrying against latest main..."
            sleep 2
          done

          echo "Failed to push galaxy.yml version bump after retries"
          exit 1
        shell: bash
        working-directory: "${{ github.workspace }}"