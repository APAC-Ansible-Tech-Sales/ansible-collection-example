name: Publish to Automation Hub
description: Publish Collection to Automation Hub
inputs:
  RedHatAutomationHubToken:
    type: secret
    description: "The offline token for Ansible"
    required: true
  VaultPassword:
    type: string
    description: "Vault decryption password"
    required: true
  AAPHostname:
    type: string
    description: "The AAP instance"
    default: "https://server.example.com"

runs:
  using: composite
  steps:
    - name: Install Galaxy requirements
      env:
        ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
        ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_TOKEN: ${{ inputs.RedHatAutomationHubToken }}
        ANSIBLE_GALAXY_SERVER_UPSTREAM_GALAXY_URL: https://galaxy.ansible.com
        ANSIBLE_GALAXY_SERVER_LIST: automation_hub_certified,upstream_galaxy
      run: |
        ansible-galaxy collection install ansible.controller infra.aap_configuration
      shell: bash
      working-directory: ${{ github.workspace }}

    - name: Run Playbook
      run: |
        ansible-playbook \
        '${{ github.action_path }}/playbook.yml' \
        -e 'collection_path="${{ github.workspace }}"' \
        -e 'aap_hostname="${{ inputs.AAPHostname }}"' \
        -e "@${{ github.action_path }}/vault.yml" \
        --vault-password-file <(cat <<<"${{ inputs.VaultPassword }}")
      shell: bash
