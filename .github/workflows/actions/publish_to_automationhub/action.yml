name: Publish to Automation Hub
description: Publish Collection to Automation Hub
inputs:
  RedHatAutomationHubToken:
    type: secret
    description: "The offline token for Ansible"
    required: true
  VaultPassword:
    type: string
    description: "Vault decryption password"
    required: true
  AAPHostname:
    type: string
    description: "The AAP instance"
    default: "https://server.example.com"
  # CollectionVersion:
  #   type: string
  #   description: "The collection version to publish or approve"
  #   required: true

runs:
  using: composite
  steps:
    - name: Install Galaxy requirements
      run: |
        # Update token in ansible cfg, it expires every 30 days and the refresh should be automated
        sed -i "s#token = <REPLACED_WITH_SECRET>#token = ${{ inputs.RedHatAutomationHubToken }}#g" ${{ github.action_path }}/ansible.cfg
        # Install collections
        ansible-galaxy collection install infra.aap_configuration
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Run Playbook
      run: |
        ansible-playbook \
        '${{ github.action_path }}/playbook.yml' \
        -e 'collection_path="${{ github.workspace }}"' \
        -e 'aap_hostname="${{ inputs.AAPHostname }}"' \
        # -e 'collection_version="${{ inputs.CollectionVersion }}"' \
        -e "@${{ github.action_path }}/vault.yml" \
        --vault-password-file <(cat <<<"${{ inputs.VaultPassword }}")
      shell: bash
