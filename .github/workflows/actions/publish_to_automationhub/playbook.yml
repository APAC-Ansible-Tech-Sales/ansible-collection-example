---
- name: Publish to Automation Hub
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    ansible_connection: local
    aap_username: admin
    aap_hostname: "{{ aap_hostname }}" # From GitHub Vars
    aap_password: "{{ aap_password }}" # From .github/workflows/actions/publish_to_automationhub/vault.yml
    # hub_publish treats hub_auto_approve=false as "approve in a follow-up task",
    # so both true and false end up approving. Drive approval only via ah_collection.
    __publish_approve: "{{ approve | default(false) | bool }}"

  tasks:
    - name: Include Variables from Galaxy YAML
      ansible.builtin.include_vars:
        dir: "{{ collection_path }}"
        files_matching: galaxy.yml

    - name: Set publish facts
      ansible.builtin.set_fact:
        __publish_version: "{{ collection_version | default(version, true) }}"
        __publish_working_dir: "{{ aap_configuration_working_dir | default('/var/tmp') }}/{{ name }}"

    - name: Show Details
      ansible.builtin.debug:
        msg: |
          The following collection will be published:
          Namespace: {{ namespace }}
          Collection: {{ name }}
          Version: {{ __publish_version }}
          Repository: {{ repository }}
          Approve: {{ __publish_approve }}

    - name: Create Namespace If Required
      ansible.builtin.include_role:
        name: infra.aap_configuration.hub_namespace
      vars:
        aap_validate_certs: "{{ ah_validate_certs | default(true) }}"
        hub_namespaces:
          - name: "{{ namespace }}"
            description: "{{ description }}"
            company: "{{ company | default(omit) }}"
            email: "{{ email | default(omit) }}"
            avatar_url: "{{ avatar_url | default(omit) }}"
            resources: "{{ resources | default(omit) }}"
            links: "{{ links | default(omit) }}"

    - name: Stage collection sources for build
      ansible.builtin.copy:
        src: "{{ collection_path }}/"
        dest: "{{ __publish_working_dir }}/"
        remote_src: true
        mode: "0700"

    - name: Set collection version for this publish
      ansible.builtin.lineinfile:
        path: "{{ __publish_working_dir }}/galaxy.yml"
        regexp: "^version:"
        line: "version: {{ __publish_version }}"
      when: __publish_version | length > 0

    - name: Build collection
      ansible.hub.ah_build:
        path: "{{ __publish_working_dir }}"
        output_path: "{{ __publish_working_dir }}"
        force: true
      register: __publish_build

    - name: Find built collection tarball
      ansible.builtin.find:
        paths: "{{ __publish_working_dir }}"
        patterns: "*.tar.gz"
      register: __publish_tarballs

    - name: Publish collection
      ansible.hub.ah_collection:
        namespace: "{{ namespace }}"
        name: "{{ name }}"
        version: "{{ __publish_version }}"
        path: "{{ __publish_tarballs.files[0].path }}"
        repository: "{{ repository }}"
        auto_approve: "{{ __publish_approve }}"
        overwrite_existing: true
        ah_host: "{{ aap_hostname | default(omit) }}"
        ah_username: "{{ aap_username | default(omit) }}"
        ah_password: "{{ aap_password | default(omit) }}"
        validate_certs: "{{ ah_validate_certs | default(true) }}"
      when: __publish_tarballs.files | length > 0

    - name: Cleanup working dir
      ansible.builtin.file:
        path: "{{ __publish_working_dir }}"
        state: absent
