name: Ansible Collection Docs, Tagging and Publishing
on:
  workflow_dispatch: # Remove later
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  docsible:
    # if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: ./.github/workflows/template_docsible.yml
    with:
      GitHubAppId: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
    secrets:
      DeployPrivateSSHKey: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}

