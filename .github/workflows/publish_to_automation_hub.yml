name: Publish to Automation Hub
on:
  workflow_dispatch: # Remove later
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - closed

jobs:
  publish_to_automation_hub:
    # if: github.event.pull_request.merged == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - run: tree ${{ github.workspace }}/.github/
      - name: Publish Collection to Automation Hub
        uses: ./.github/workflows/actions/publish_to_automationhub/action.yml
        with:
          VaultPassword: ${{ secrets.ANSIBLE_VAULT }}
          RedHatAutomationHubOfflineToken: ${{ secrets.REDHATAUTOMATIONHUBOFFLINETOKEN }}
