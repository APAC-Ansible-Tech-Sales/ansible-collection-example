name: Publish to Automation Hub
on:
  workflow_dispatch: # Remove later
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - closed

jobs:
  publish_to_pah:
    # if: github.event.pull_request.merged == true
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main
      - name: Publish Collection to Automation Hub
        uses: ./.github/workflows/actions/publish_to_automationhub/action.yml
        with:
          VaultPassword: ${{ secrets.ANSIBLE_VAULT }}
          GitHubAppId: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
          GitHubAppPrivateKey: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
          RedHatAutomationHubOfflineToken: ${{ secrets.REDHATAUTOMATIONHUBOFFLINETOKEN }}
