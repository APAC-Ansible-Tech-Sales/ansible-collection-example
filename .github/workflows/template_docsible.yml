---
name: Docsible (Generate Documentation) Template
on:
  workflow_call:
    secrets:
      GitHubAppPrivateKey:
        description: "The private key for the GitHub App"
        required: true
    inputs:
      GitHubAppId:
        description: "The id of the GitHub App"
        required: true
        type: string

jobs:
  docsible:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@main
        id: gh_token
        with:
          private-key: ${{ secrets.GitHubAppPrivateKey }}
          client-id: ${{ inputs.GitHubAppId }}
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          token: ${{ steps.gh_token.outputs.token }}
      - name: Ensure docsible CLI is installed
        run: |
          if ! command -v docsible >/dev/null; then
            pip3 install docsible==0.8.0
          fi
        shell: bash
        working-directory: "${{ github.workspace }}"
      - name: Generate Documentation
        run: |
          docsible --no-backup --no-docsible --collection ./
        shell: bash
        working-directory: "${{ github.workspace }}"
      - name: Commit Documentation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage adds, edits, and deletes (docsible removes/replaces READMEs)
          git add -A

          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            git status --porcelain
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation changes detected:"
            git status --porcelain
            git commit -m "Update documentation"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
        working-directory: "${{ github.workspace }}"
      - name: Push Documentation
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push
        shell: bash
        working-directory: "${{ github.workspace }}"