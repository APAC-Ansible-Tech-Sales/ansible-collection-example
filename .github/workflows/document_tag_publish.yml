name: Stage, Bump, Document and Publish to Automation Hub
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  detect_new_semver_tag:
    name: Detect New SemVer Tag
    outputs:
      next_tag: ${{ steps.semver.outputs.next_tag }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@main
        id: gh_token
        with:
          private-key: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
          client-id: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          token: ${{ steps.gh_token.outputs.token }}
          fetch-depth: 0
      - name: Get Next SemVer Tag
        id: semver
        uses: AcmeSoftwareLLC/semver-tag@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  stage_in_automation_hub:
    name: Stage in Automation Hub
    if: github.event.pull_request.merged == false
    needs: detect_new_semver_tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Publish Collection to Automation Hub
        uses: ./.github/workflows/actions/publish_to_automationhub
        with:
          VaultPassword: ${{ secrets.ANSIBLE_VAULT }} # Contains the AAP Host password
          RedHatAutomationHubToken: ${{ secrets.REDHATAUTOMATIONHUBOFFLINETOKEN }}
          AAPHostname: ${{ vars.AAP_HOSTNAME }}
          Repository: staging
          CollectionVersion: ${{ needs.detect_new_semver_tag.outputs.next_tag }}
          Approve: false
  bump_semver:
    if: github.event.pull_request.merged == true
    name: Bump Collection SemVer Tag
    permissions:
      contents: write
    uses: ./.github/workflows/template_bump_semver.yml
    with:
      GitHubAppId: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
    secrets:
      GitHubAppPrivateKey: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
  docsible:
    if: github.event.pull_request.merged == true
    name: Docsible
    needs: bump_semver
    permissions:
      contents: write
    uses: ./.github/workflows/template_docsible.yml
    with:
      GitHubAppId: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
    secrets:
      GitHubAppPrivateKey: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
  publish_in_automation_hub:
    if: github.event.pull_request.merged == true
    name: Publish in Automation Hub
    needs:
      - docsible
      - detect_new_semver_tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Publish Collection to Automation Hub
        uses: ./.github/workflows/actions/publish_to_automationhub
        with:
          VaultPassword: ${{ secrets.ANSIBLE_VAULT }} # Contains the AAP Host password
          RedHatAutomationHubToken: ${{ secrets.REDHATAUTOMATIONHUBOFFLINETOKEN }}
          AAPHostname: ${{ vars.AAP_HOSTNAME }}
          Repository: published
          CollectionVersion: ${{ needs.detect_new_semver_tag.outputs.next_tag }}
          Approve: true
