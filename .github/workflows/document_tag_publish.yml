name: Stage, Bump, Document and Publish to Automation Hub
on:
  workflow_dispatch: # Remove later
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  get_new_semver_tag:
    name: Get New SemVer Tag
    # if: github.event.pull_request.merged == true
    outputs:
      next_tag: ${{ steps.semver.outputs.next_tag }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@main
        id: gh_token
        with:
          private-key: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
          client-id: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          token: ${{ steps.gh_token.outputs.token }}
          fetch-depth: 0
      - name: Set First Tag if Required    
        run: |
          if [ -z "$(git tag -l)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a 1.0.0 -m "Initial tag"
            git push origin 1.0.0
          fi
      - name: Get Next SemVer Tag
        id: semver
        uses: AcmeSoftwareLLC/semver-tag@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  bump_semver:
    # if: github.event.pull_request.merged == true
    name: Bump Collection SemVer Tag
    needs: get_new_semver_tag
    permissions:
      contents: write
    uses: ./.github/workflows/template_bump_semver.yml
    with:
      GitHubAppId: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
      NextTag: ${{ needs.get_new_semver_tag.outputs.next_tag }}
    secrets:
      GitHubAppPrivateKey: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
  docsible:
    # if: github.event.pull_request.merged == true
    name: Docsible
    needs: bump_semver
    permissions:
      contents: write
    uses: ./.github/workflows/template_docsible.yml
    with:
      GitHubAppId: ${{ vars.ANSIBLECOLLECTIONSREPOPUSHAPPID }}
    secrets:
      GitHubAppPrivateKey: ${{ secrets.ANSIBLECOLLECTIONSREPOPUSHPRIVATEKEY }}
  publish_in_automation_hub:
    # if: github.event.pull_request.merged == true
    name: Publish in Automation Hub
    needs:
      - docsible
      - get_new_semver_tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Publish Collection to Automation Hub
        uses: ./.github/workflows/actions/publish_to_automationhub
        with:
          VaultPassword: ${{ secrets.ANSIBLE_VAULT }} # Vault contains the AAP Host password
          RedHatAutomationHubToken: ${{ secrets.REDHATAUTOMATIONHUBTOKEN }}
          AAPHostname: ${{ vars.AAP_HOSTNAME }}
          CollectionVersion: ${{ needs.get_new_semver_tag.outputs.next_tag }}
