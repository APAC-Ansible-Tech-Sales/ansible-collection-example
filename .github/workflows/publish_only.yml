name: Publish Ansible Collection
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, e.g. 1.2.3 or main'
        required: true
        default: 'main'

jobs:
  publish_to_pah:
    permissions:
      contents: read
    runs-on: release-general-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
      - name: Publish collection to Private Automation Hub
        uses: ./.github/workflow-templates/publish_to_pah.yml
        with:
          source_path: ${{ github.workspace }}
          vault_password: ${{ secrets.PAH_VAULT_PASSWORD }}
          github_token: ${{ secrets.ORG_READ_CHECKOUT_TOKEN }}
